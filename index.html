<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter Flash Reader</title>
<style>
  :root { color-scheme: dark; --bg:#10131a; --panel:#191f2b; --muted:#aab4c5; --accent:#8bd5ca; --line:#30394a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(ellipse at top,#202b3b 0,#10131a 55%); color:#f4f6fb; font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; display:grid; place-items:center; padding:24px; }
  main { width:min(900px,100%); }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; }
  h1 { font-size:1.15rem; letter-spacing:.02em; margin:0; }
  .subtle { color:var(--muted); font-size:.9rem; }
  .reader { min-height:390px; background:rgba(25,31,43,.92); border:1px solid var(--line); border-radius:22px; display:flex; flex-direction:column; padding:24px; box-shadow:0 20px 60px #0005; }
  .reader-top { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:.9rem; }
  .stage { flex:1; min-height:240px; display:grid; place-items:center; position:relative; padding:30px 12px; }
  .word { font-size:clamp(2.6rem,8vw,5.8rem); font-weight:650; letter-spacing:-.045em; text-align:center; line-height:1.1; overflow-wrap:anywhere; }
  .word.empty { color:#778397; font-size:clamp(1.15rem,3vw,1.5rem); font-weight:450; letter-spacing:0; }
  .progress { height:5px; background:#30394a; border-radius:99px; overflow:hidden; }
  .progress > div { height:100%; width:0; background:var(--accent); transition:width .12s linear; }
  .controls { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:20px; }
  button { border:1px solid var(--line); color:#f4f6fb; background:#252e3d; padding:11px 17px; border-radius:12px; font:600 .95rem system-ui; cursor:pointer; }
  button:hover { background:#344155; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  button.primary { background:var(--accent); color:#10201e; border-color:transparent; min-width:112px; }
  button.primary:hover { background:#a6e7dd; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  .settings { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:15px; color:var(--muted); font-size:.9rem; }
  input[type=range] { accent-color:var(--accent); width:140px; }
  details { margin-top:18px; background:#151b25; border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  summary { cursor:pointer; font-weight:600; }
  textarea { display:block; width:100%; min-height:140px; margin-top:12px; resize:vertical; background:#0f141d; color:#f4f6fb; border:1px solid var(--line); border-radius:10px; padding:12px; font: .9rem/1.5 ui-monospace,SFMono-Regular,monospace; }
  .editor-actions { display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap; }
  .hint { color:var(--muted); font-size:.82rem; }
  @media(max-width:560px) { body{padding:14px} .reader{padding:17px;min-height:360px} header{align-items:flex-start;flex-direction:column} .stage{min-height:220px} }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Chapter Flash Reader</h1><div class="subtle">One word at a time. One steady focal point.</div></div>
    <div class="subtle" id="chapterCount">4 chapters loaded</div>
  </header>

  <section class="reader" aria-label="Reading player">
    <div class="reader-top"><span id="chapterLabel">CHAPTER 1</span><span id="wordCount">Word 1 of 13</span></div>
    <div class="stage"><div class="word" id="word" aria-live="off">The</div></div>
    <div class="progress" aria-label="Chapter progress"><div id="progressFill"></div></div>
    <div class="controls">
      <button id="prev" title="Previous chapter" aria-label="Previous chapter">↶ Rewind</button>
      <button id="play" class="primary">▶ Play</button>
      <button id="next" title="Next chapter" aria-label="Next chapter">Skip ↷</button>
    </div>
    <div class="settings">
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="60" max="600" step="10" value="240">
      <output id="speedValue">240 WPM</output>
    </div>
  </section>

  <details>
    <summary>Load or edit book text</summary>
    <p class="hint">Separate chapters with headings such as CHAPTER 1: or CHAPTER 2. The sample is preloaded.</p>
    <textarea id="bookText" spellcheck="false">CHAPTER 1:
The pigeon at the bus stop has been waiting longer than I have.
CHAPTER 2:
She only paints with bold colors; she does not like pastels.
CAPTER 3:
The cat pushed my cup off the table and then looked at me as if I had done it.
CHAPTER 4:
The moon left a polite note on my window explaining that it would be a little late tonight.</textarea>
    <div class="editor-actions">
      <button id="load">Load chapters</button>
      <span class="hint" id="loadStatus">Chapter headings start a new chapter.</span>
    </div>
  </details>
</main>
<script>
(() => {
  const sample = document.getElementById('bookText').value;
  const wordEl = document.getElementById('word');
  const labelEl = document.getElementById('chapterLabel');
  const countEl = document.getElementById('wordCount');
  const fillEl = document.getElementById('progressFill');
  const playBtn = document.getElementById('play');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const speed = document.getElementById('speed');
  const speedValue = document.getElementById('speedValue');
  const chapterCount = document.getElementById('chapterCount');
  const status = document.getElementById('loadStatus');

  let chapters = [];
  let chapterIndex = 0;
  let wordIndex = 0;
  let playing = false;
  let timer = null;

  function parseChapters(text) {
    const result = [];
    let currentTitle = 'CHAPTER 1';
    let currentText = [];
    const lines = text.split(/\r?\n/);
    const heading = /^\s*(?:chapter|capter)\s+[\w.-]+\s*:?\s*$/i;
    for (const line of lines) {
      if (heading.test(line)) {
        if (currentText.join(' ').trim()) result.push({title: currentTitle, words: currentText.join(' ').trim().split(/\s+/)});
        currentTitle = line.trim().replace(/:?\s*$/, '').toUpperCase().replace(/^CAPTER\b/, 'CHAPTER');
        currentText = [];
      } else if (line.trim()) currentText.push(line.trim());
    }
    if (currentText.join(' ').trim()) result.push({title: currentTitle, words: currentText.join(' ').trim().split(/\s+/)});
    return result;
  }

  function stopTimer() {
    if (timer !== null) clearTimeout(timer);
    timer = null;
  }
  function render() {
    const chapter = chapters[chapterIndex];
    if (!chapter) {
      wordEl.textContent = 'Load some chapters to begin';
      wordEl.classList.add('empty');
      labelEl.textContent = 'NO CHAPTER';
      countEl.textContent = '—';
      fillEl.style.width = '0%';
      return;
    }
    wordEl.classList.remove('empty');
    const total = chapter.words.length;
    wordEl.textContent = chapter.words[wordIndex] ?? 'Chapter complete';
    labelEl.textContent = chapter.title;
    countEl.textContent = wordIndex < total ? `Word ${wordIndex + 1} of ${total}` : `${total} words · complete`;
    fillEl.style.width = `${Math.min(100, wordIndex / total * 100)}%`;
    chapterCount.textContent = `${chapters.length} chapter${chapters.length === 1 ? '' : 's'} loaded`;
    prevBtn.disabled = chapterIndex === 0;
    nextBtn.disabled = chapterIndex === chapters.length - 1;
    playBtn.textContent = playing ? 'Ⅱ Pause' : (wordIndex >= total ? '▶ Next chapter' : '▶ Play');
  }
  function pause() {
    playing = false;
    stopTimer();
    render();
  }
  function tick() {
    if (!playing) return;
    const chapter = chapters[chapterIndex];
    if (wordIndex < chapter.words.length - 1) {
      wordIndex++;
      render();
      timer = setTimeout(tick, 60000 / Number(speed.value));
    } else {
      // End of chapter: stop here. Play advances to the next chapter.
      wordIndex = chapter.words.length;
      pause();
    }
  }
  function play() {
    if (!chapters.length) return;
    if (wordIndex >= chapters[chapterIndex].words.length) {
      if (chapterIndex >= chapters.length - 1) { render(); return; }
      chapterIndex++;
      wordIndex = 0;
    }
    playing = true;
    render();
    timer = setTimeout(tick, 60000 / Number(speed.value));
  }

  playBtn.addEventListener('click', () => playing ? pause() : play());
  prevBtn.addEventListener('click', () => {
    pause();
    if (chapterIndex > 0) { chapterIndex--; wordIndex = 0; }
    render();
  });
  nextBtn.addEventListener('click', () => {
    pause();
    if (chapterIndex < chapters.length - 1) { chapterIndex++; wordIndex = 0; }
    render();
  });
  speed.addEventListener('input', () => {
    speedValue.value = `${speed.value} WPM`;
    if (playing) { stopTimer(); timer = setTimeout(tick, 60000 / Number(speed.value)); }
  });
  document.getElementById('load').addEventListener('click', () => {
    pause();
    const parsed = parseChapters(document.getElementById('bookText').value);
    if (!parsed.length) { status.textContent = 'No chapter text found. Add a heading and some text.'; return; }
    chapters = parsed;
    chapterIndex = 0;
    wordIndex = 0;
    status.textContent = `Loaded ${chapters.length} chapter${chapters.length === 1 ? '' : 's'}.`;
    render();
  });

  chapters = parseChapters(sample);
  render();
})();
</script>
</body>
</html>
